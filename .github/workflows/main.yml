name: Build iOS

on:
  push:
    branches:
      - release/release2.1.33
  pull_request:
    branches:
      - release/release2.1.33

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui

      - name: Restore dependencies
        run: dotnet restore ZATCAMAUI/ZATCAMAUI.csproj

      - name: Set up Signing Certificate
        run: |
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > ios_certificate.p12
          security import ios_certificate.p12 -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign

      - name: Set up Provisioning Profile
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > ZATCA.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ZATCA.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build the iOS app
        run: |
          dotnet build ZATCAMAUI/ZATCAMAUI.csproj \
            -f:net8.0-ios \
            -c Release \
            /p:Platform=iPhone

      - name: Publish the iOS app
        run: |
          dotnet publish ZATCAMAUI/ZATCAMAUI.csproj \
            -f:net8.0-ios \
            -c Release \
            -o output \
            /p:Platform=iPhone

      - name: Create IPA file
        run: |
          cd output
          mkdir -p Payload
          app_path=$(find . -name "*.app" | head -n 1)
          cp -R "$app_path" Payload/
          zip -r ZATCA.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZATCA.ipa
          path: output/ZATCA.ipa
